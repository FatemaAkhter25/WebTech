<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Valley College</title>
</head>

<body>
    <h1>Student Registration Form</h1>
    <form action="#" method="post">
        <label for="name">Name: </label>
        <input type="text" name="name" id="name" placeholder="Enter your full name" required><br><br>

        <label for="email">Email: </label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required><br><br>

        <label for="password">Password: </label>
        <input type="password" name="password" id="password" required><br><br>

        <label for="age">Age: </label>
        <input type="number" name="age" id="age" min="6" max="120" required><br><br>

        <label for="dob">Date of birth: </label>
        <input type="date" name="dob" id="dob" required><br><br>

        Gender:
        <input type="radio" name="Gender" value="Male">Male
        <input type="radio" name="Gender" value="Female">Female
        <input type="radio" name="Gender" value="Other">Other
        <br><br>

        <label for="city">City: </label>
        <select id="city" name="city">
            <option value="Dhaka">Dhaka</option>
            <option value="Khulna">Khulna</option>
            <option value="Rajshahi">Rajshahi</option>
            <option value="Sylhet">Sylhet</option>
        </select><br><br>

        Hobbies:
        <input type="checkbox" name="hobbies" value="Reading">Reading
        <input type="checkbox" name="hobbies" value="Cricket">Cricket
        <input type="checkbox" name="hobbies" value="Music">Music
        <br><br>
        <label for="about">About Yourself: </label><br>
        <textarea id="about" name="about" rows="7" cols="40"></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
</body>

</html>
